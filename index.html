<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/main.css">
    <title>Iniciar Sesion - Katoa</title>
</head>

<body>
    <main>
        <div class="main-container">
            <div class="header-content">
                <h1>Bienvenido a Katoa</h1>
                <h3>Iniciar Sesion</h3>
            </div>
            <div class="form-container">
                <label for="email">Correo electrónico</label>  
                <input type="email" id="email-login" name="email" required>

                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required>
                    <button type="button" id="viewPassword" class="btn-eye">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <div class="footer-content">
            <button class="primary-btn" id="loginButton">Iniciar Sesion</button>
            </div>
        </div>
    </main>
    <script src="js/utils/passwordView.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
