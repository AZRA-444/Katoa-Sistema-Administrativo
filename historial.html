<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#BE6E41" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icons/favicon-32.png" />
    <meta name="application-name" content="Katoa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Katoa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script src="/js/pwa.js" defer></script>
    <title>Facturas de hoy — Katoa</title>
    <link rel="stylesheet" href="../vendor/fontawesome-6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../vendor/fonts-5.3.0/fonts.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/facturacion.css" />
    <link rel="stylesheet" href="../css/inventario.css" />
    <link rel="stylesheet" href="../css/historial.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="icon" href="../img/favicon.ico" />
    <script src="../../js/utils/tablas-responsive.js" defer></script>
    <script src="../../js/auth-guard.js"></script>
    <script type="module" src="../../js/historial.js"></script>
</head>

<body>
    <header class="topbar">
        <a class="back" href="../../index.html" aria-label="Volver al inicio"><i class="fas fa-arrow-left"></i></a>
        <h1>Facturas de hoy</h1>
        <button type="button" class="btn btn-ghost" id="btnActualizar"><i class="fas fa-rotate"></i>
            Actualizar</button>
    </header>

    <main class="inv-wrap" data-encargado-access>
        <section class="kpis" aria-label="Resumen del día" aria-live="polite">
            <div class="kpi"><span>Facturas</span><strong id="kCant">0</strong></div>
            <div class="kpi"><span>Total vendido (USD)</span><strong id="kUsd">$ 0,00</strong></div>
            <div class="kpi"><span>Total vendido (Bs)</span><strong id="kBs">Bs 0,00</strong></div>
            <div class="kpi" id="kpiAnuladas" hidden><span>Anuladas</span><strong id="kAnul">0</strong></div>
        </section>

        <section class="panel">
            <div class="tools">
                <div class="field grow"><label for="fBuscar">Buscar</label><input id="fBuscar" type="search"
                        maxlength="60" placeholder="Número de factura, cliente, cédula o teléfono" autocomplete="off" />
                </div>
                <div class="field">
                    <span class="lbl" id="lblEstado">Estado</span>
                    <div class="filtros" role="group" aria-labelledby="lblEstado">
                        <button type="button" class="filtro" data-estado="" aria-pressed="true">Todas</button>
                        <button type="button" class="filtro" data-estado="activa" aria-pressed="false">Activas</button>
                        <button type="button" class="filtro" data-estado="anulada"
                            aria-pressed="false">Anuladas</button>
                    </div>
                </div>
            </div>
            <h2>Facturas <span class="count" id="cont">0</span></h2>
            <div id="lista" class="lista-fac" aria-busy="false"></div>
            <p class="nota" id="nota" hidden></p>
            <div class="empty" id="vacio" hidden><i class="fas fa-file-invoice"></i>
                <p id="vacioTxt">Hoy todavía no hay facturas.</p>
            </div>
        </section>
    </main>

    <p id="aviso" class="aviso" role="status" hidden></p>
</body>

</html>
