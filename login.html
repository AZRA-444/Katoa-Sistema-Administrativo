<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#BE6E41">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">
     <link rel="icon" href="assets/img/favicon.ico">
    <title>Iniciar sesión — Katoa</title>
</head>

<body>
    <div class="login-shell">
        <aside class="login-brand">
            <div class="brand-mark">Katoa</div>
            <div class="brand-sub">Corporación Katoa Global</div>
            <p class="brand-lead">Gestión clara para el trabajo de cada día.</p>
        </aside>

        <main>
            <form class="main-container" id="loginForm" novalidate>
                <div class="header-content">
                    <h1>Bienvenido</h1>
                    <p>Inicia sesión para continuar.</p>
                </div>

                <div class="form-container">
                    <div class="field">
                        <label for="email-login">Correo electrónico</label>
                        <input type="email" id="email-login" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" placeholder="nombre@empresa.com" required autofocus>
                    </div>

                    <div class="field">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" autocomplete="current-password" required>
                            <button type="button" id="viewPassword" class="btn-eye" aria-label="Mostrar contraseña">
                                <i class="fa-solid fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <p id="loginError" class="form-error" role="alert" hidden></p>

                <div class="footer-content">
                    <button type="submit" class="primary-btn" id="loginButton">Iniciar sesión</button>
                </div>
            </form>
        </main>
    </div>

    <script src="js/utils/passwordView.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
