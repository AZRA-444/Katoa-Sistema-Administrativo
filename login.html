<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#BE6E41">
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icons/favicon-32.png" />
    <meta name="application-name" content="Katoa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Katoa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script src="/js/pwa.js" defer></script>
    <link rel="stylesheet" href="assets/vendor/fontawesome-6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="assets/vendor/fonts-5.3.0/fonts.css" />
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <title>Iniciar sesión — Katoa</title>
</head>

<body>
    <div class="login-shell">
        <aside class="login-brand">
            <div class="brand-mark">Katoa</div>
            <div class="brand-sub">Corporación Katoa Global</div>
            <p class="brand-lead">Gestión clara para el trabajo de cada día.</p>
        </aside>

        <main>
            <form class="main-container" id="loginForm" novalidate>
                <div class="header-content">
                    <h1>Bienvenido</h1>
                    <p>Inicia sesión para continuar.</p>
                </div>

                <div class="form-container">
                    <div class="field">
                        <label for="email-login">Correo electrónico</label>
                        <input type="email" id="email-login" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" placeholder="nombre@empresa.com" required autofocus>
                    </div>

                    <div class="field">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" autocomplete="current-password" required>
                            <button type="button" id="viewPassword" class="btn-eye" aria-label="Mostrar contraseña">
                                <i class="fa-solid fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <p id="loginError" class="form-error" role="alert" hidden></p>

                <div class="footer-content">
                    <button type="submit" class="primary-btn" id="loginButton">Iniciar sesión</button>
                </div>
            </form>
        </main>
    </div>

    <script src="js/utils/passwordView.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
