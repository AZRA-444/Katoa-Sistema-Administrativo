<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <meta name="theme-color" content="#BE6E41" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <title>Nueva Venta — Katoa</title>
</head>

<body>
    <dialog id="modalDataCliente" class="modal-container">
        <div class="modal-box">
            <h2>Datos del Cliente <i class="fas fa-user"></i></h2>

            <div class="form-modal-grid">
                <label class="form-field"> Nombre
                    <input type="text" id="nameClient" placeholder="Maria" oninput="formatText(this)">
                </label>

                <label class="form-field"> Apellido
                    <input type="text" id="lastNameClient" placeholder="Gonzalez" oninput="formatText(this)">
                </label>

                <div class="form-document">
                    <label class="form-field"> Cedula / RIF
                        <select id="documentType">
                            <option value="V">V</option>
                            <option value="E">E</option>
                            <option value="J">J</option>
                            <option value="G">G</option>
                            <option value="P">P</option>
                            <option value="C">C</option>
                        </select>
                        <input type="text" id="documentNumber" placeholder="12345678" inputmode="numeric" maxlength="8"
                            required />
                    </label>
                </div>
            </div>
        </div>
    </dialog>
    <script src="/js/facturacion.js"></script>
    <script src="/js/utils/formateadores.js"></script>
</body>

</html>
